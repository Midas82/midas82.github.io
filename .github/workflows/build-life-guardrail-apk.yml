name: Build Life Guardrail APK

on:
  push:
    paths:
      - 'life-guardrail/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor Project
        run: |
          cd ${{ github.workspace }}
          mkdir -p capacitor-build
          cd capacitor-build
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications

          # Initialize Capacitor
          npx cap init "Life Guardrail" "com.midas.lifeguardrail" --web-dir=www

          # Copy PWA files
          mkdir -p www
          cp -r ${{ github.workspace }}/life-guardrail/* www/

          # Add Android platform
          npx cap add android

      - name: Configure Android Permissions
        run: |
          cd ${{ github.workspace }}/capacitor-build/android/app/src/main

          # Add permissions to AndroidManifest.xml
          sed -i '/<\/manifest>/i \
          \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n\
          \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n\
          \    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n\
          \    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n\
          \    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n\
          \    <uses-permission android:name="android.permission.VIBRATE" \/>\n\
          \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>' AndroidManifest.xml

      - name: Update Capacitor Config
        run: |
          cd ${{ github.workspace }}/capacitor-build
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.midas.lifeguardrail",
            "appName": "Life Guardrail",
            "webDir": "www",
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            },
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_icon_config_sample",
                "iconColor": "#FFD700",
                "sound": "beep.wav"
              }
            }
          }
          EOF

      - name: Fix Kotlin Dependency Conflicts
        run: |
          cd ${{ github.workspace }}/capacitor-build/android

          # Add dependency resolution to app/build.gradle
          cat >> app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Sync Capacitor
        run: |
          cd ${{ github.workspace }}/capacitor-build
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd ${{ github.workspace }}/capacitor-build/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Sign APK
        run: |
          cd ${{ github.workspace }}/capacitor-build/android/app/build/outputs/apk/debug

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)

          # Generate keystore
          keytool -genkey -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Midas82, OU=Development, O=Midas Digital Solutions, L=Unknown, S=Unknown, C=US" \
            -storepass android -keypass android

          # Zipalign FIRST (required before apksigner)
          ${BUILD_TOOLS}zipalign -f -v 4 app-debug.apk app-aligned.apk

          # Sign with apksigner (v2/v3 signing for modern Android)
          ${BUILD_TOOLS}apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debug \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out life-guardrail.apk \
            app-aligned.apk

          # Verify signature
          ${BUILD_TOOLS}apksigner verify --verbose life-guardrail.apk

      - name: Move APK
        run: |
          mv ${{ github.workspace }}/capacitor-build/android/app/build/outputs/apk/debug/life-guardrail.apk ${{ github.workspace }}/life-guardrail.apk

      - name: Create Release and Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "life-guardrail-v${{ github.run_number }}" \
            ./life-guardrail.apk \
            --repo ${{ github.repository }} \
            --title "Life Guardrail APK v${{ github.run_number }}" \
            --notes "Install: Download life-guardrail.apk, tap to install. Enable Install from Unknown Sources if prompted."

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-guardrail-apk
          path: ./life-guardrail.apk
          retention-days: 90
